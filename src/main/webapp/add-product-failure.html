 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Product Save Error</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 450px;
            margin: 100px auto;
            background-color: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .error-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h2 {
            color: #dc2626;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 11px 20px;
            margin: 5px;
            text-decoration: none;
            color: white;
            background-color: #2563eb;
            border-radius: 6px;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .home {
            background-color: #6b7280;
        }

        .home:hover {
            background-color: #4b5563;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="error-icon">❌</div>

        <h2>Product Save Failed</h2>

        <p>
            Error saving product to the inventory.
            Please try again.
        </p>

        <a href="addproduct" class="btn">
            Try Again
        </a>

        <a href="index.jsp" class="btn home">
            Back to Home
        </a>

    </div>

</body>

</html>
