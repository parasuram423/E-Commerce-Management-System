 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up Successful</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 450px;
            margin: 120px auto;
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h2 {
            color: #16a34a;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .button:hover {
            background-color: #1d4ed8;
        }

        .signin {
            display: block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        .signin:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🎉</div>

        <h2>Congratulations!</h2>

        <p>
            Your account has been created successfully.
            You can now sign in using your username and password.
        </p>

        <a class="button" href="signin">Sign In</a>

        <a class="signin" href="index.jsp">← Back to Home</a>

    </div>

</body>

</html>
