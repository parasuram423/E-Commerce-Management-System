 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Search Product</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 450px;
            margin: 80px auto;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .or {
            text-align: center;
            font-weight: bold;
            color: #777;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>🔍 Search Product</h2>

        <form action="searchproduct" method="post">

            <label>Product ID</label>

            <input type="number"
                   name="pid"
                   placeholder="Enter Product ID">

            <div class="or">OR</div>

            <label>Product Name</label>

            <input type="text"
                   name="pname"
                   placeholder="Enter Product Name">

            <button type="submit">
                Proceed
            </button>

        </form>

        <a class="back" href="index.jsp">
            ← Back to Home
        </a>

    </div>

</body>

</html>
