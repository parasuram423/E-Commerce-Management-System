 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Add Product</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>➕ Add New Product</h2>

        <form action="addproduct" method="post">

            <label>Product Name</label>
            <input type="text" name="pname" required>

            <label>Brand</label>
            <input type="text" name="pbrand" required>

            <label>Description</label>
            <input type="text" name="pdesc" required>

            <label>Status</label>
            <select name="pstatus" required>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
                <option value="Draft">Draft</option>
                <option value="Discontinued">Discontinued</option>
            </select>

            <button type="submit">Add Product</button>

        </form>

        <a class="back" href="index.jsp">
            ← Back to Home
        </a>

    </div>

</body>

</html>
