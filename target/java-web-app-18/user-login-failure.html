 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Invalid Access</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 120px auto;
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h2 {
            color: #dc2626;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .button:hover {
            background-color: #1d4ed8;
        }

        .home {
            display: block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        .home:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">⚠️</div>

        <h2>Invalid Access</h2>

        <p>
            Your username or password is incorrect.
            Please try signing in again.
        </p>

        <a class="button" href="signin">Try Again</a>

        <a class="home" href="index.html">← Back to Home</a>

    </div>

</body>

</html>
